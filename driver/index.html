<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELANO | Driver</title><style>body{margin:0;background:#08090b;color:#eee;font-family:Tahoma,Arial}.w{max-width:900px;margin:auto;padding:18px}.brand{text-align:center;color:#d5ae61;font-size:27px;font-weight:800;margin:10px}.card{background:#111318;border:1px solid #292c34;border-radius:16px;padding:18px;margin:14px 0}select,button{width:100%;padding:12px;border-radius:9px;margin-top:8px}select{background:#0b0c0f;color:#fff;border:1px solid #333}button{background:#d5ae61;border:0;font-weight:700}.muted{color:#999}.trip{border-top:1px solid #292c34;padding:14px 0}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#103d2d;color:#69e1aa;font-size:11px}</style></head><body><div class="w"><div class="brand">ELANO LIMOUSINE — DRIVER</div><div class="card"><h2>بوابة السائق</h2><p class="muted">اختر اسم السائق لعرض الرحلات المسندة إليه.</p><select id="driver"></select><button onclick="render()">تحديث الرحلات</button></div><div id="out"></div></div><script>const K='elano_ops_v4';function db(){return JSON.parse(localStorage.getItem(K)||'{"drivers":[],"bookings":[]}')}function save(x){localStorage.setItem(K,JSON.stringify(x))}function render(){let x=db(),d=driver.value,a=x.bookings.filter(b=>b.driver===d);out.innerHTML=a.length?a.map(b=>`<div class="card trip"><h3>${b.id} — ${b.name}</h3><p>${b.date} | ${b.time}</p><p>من: ${b.from}</p><p>إلى: ${b.to}</p><p>السيارة: ${b.car}</p><p>الحالة: <span class="tag">${b.status}</span></p>${b.status!=='جاري'&&b.status!=='مكتمل'?`<button onclick="st('${b.id}','جاري')">بدء الرحلة</button>`:''}${b.status==='جاري'?`<button onclick="st('${b.id}','مكتمل')">إنهاء الرحلة</button>`:''}<button onclick="window.open('../track/?booking=${b.id}','_blank')">فتح التتبع</button></div>`).join(''):'<div class="card">لا توجد رحلات مسندة.</div>'}function st(id,s){let x=db(),b=x.bookings.find(b=>b.id===id);if(b){b.status=s;save(x);render()}}let x=db();driver.innerHTML=x.drivers.map(d=>`<option>${d.name}</option>`).join('');render();</script></body></html>
