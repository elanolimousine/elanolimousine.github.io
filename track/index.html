<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELANO | Track</title><style>body{margin:0;background:#08090b;color:#eee;font-family:Tahoma,Arial}.w{max-width:800px;margin:auto;padding:18px}.brand{text-align:center;color:#d5ae61;font-size:28px;font-weight:800}.card{background:#111318;border:1px solid #292c34;border-radius:16px;padding:20px;margin:15px 0}.big{font-size:27px;color:#4dd39a}.map{height:280px;border-radius:14px;background:linear-gradient(135deg,#10201d,#17130d);position:relative;overflow:hidden}.road{position:absolute;left:-10%;right:-10%;top:48%;height:38px;background:#33343a;transform:rotate(-10deg)}.car{position:absolute;top:43%;right:15%;font-size:31px;transition:right 1s}.bar{height:8px;background:#292c34;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;width:20%;background:#4dd39a;transition:width 1s}.muted{color:#999;font-size:12px}</style></head><body><div class="w"><div class="brand">ELANO LIMOUSINE</div><div id="app"></div></div><script>const id=new URLSearchParams(location.search).get('booking');const x=JSON.parse(localStorage.getItem('elano_ops_v4')||'{"bookings":[]}');const b=x.bookings.find(z=>z.id===id)||x.bookings[0];let p=15;if(!b){app.innerHTML='<div class="card">لا توجد رحلة بهذا الكود.</div>'}else{app.innerHTML=`<div class="card"><h2>تتبع الرحلة ${b.id}</h2><p>العميل: <b>${b.name}</b></p><p>من: ${b.from}</p><p>إلى: ${b.to}</p><p>السائق: ${b.driver||'سيتم التحديد'}</p><p>السيارة: ${b.car}</p><p>الحالة: <span class="big" id="status">${b.status}</span></p></div><div class="card"><div class="map"><div class="road"></div><div id="car" class="car">🚕</div></div><p>تقدم تجريبي: <b id="pct">15%</b></p><div class="bar"><i id="bar"></i></div><p class="muted">هذه محاكاة للواجهة. الموقع الحقيقي يحتاج GPS + Backend + خدمة خرائط.</p></div>`;setInterval(()=>{p=Math.min(90,p+5);car.style.right=p+'%';bar.style.width=p+'%';pct.textContent=p+'%'},1500)}</script></body></html>
